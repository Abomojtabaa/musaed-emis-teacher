name: iraq_emis
description: A new Flutter project for Iraq EMIS System.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0
  webview_flutter: ^4.4.2

  # Camera and gallery
  image_picker: ^1.0.7

  # Speech recognition and permissions
  speech_to_text: ^7.4.0
  permission_handler: ^11.3.0

  # Local storage
  shared_preferences: ^2.2.2

  # Image processing
  image: ^4.10.1

  # Local person background removal
  google_mlkit_selfie_segmentation: 0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/avatar.png
